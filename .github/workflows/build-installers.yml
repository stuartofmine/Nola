name: Build and verify Linux installers for Nola 1.0.0 build 2
on:
  push:
    branches: [release/build-2-runners]
permissions:
  contents: read
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v6
      - name: Build the CLI and Web Host
        run: |
          set -eu
          npm --prefix apps/web/frontend ci
          npm --prefix apps/web/frontend run build
          cargo build --locked --release -p nola_cli -p nola_service --bins
      - name: Package and test the installed runtime
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -eu
          name="Nola-cli-linux-$ARCH-1.0.0-build.2"
          root="$RUNNER_TEMP/staging/$name"
          rt="$root/web/playwright_runtime"
          mkdir -p "$root/bin" "$root/web/app" "$rt/bin"
          cp target/release/{nola,nola-agent-host,nola-service} "$root/bin/"
          cp LICENSE "$root/"
          cp -R apps/web/app/static "$root/web/app/"
          cp apps/web/playwright_runtime/{bridge.cjs,owner_queue.cjs,browser_use.cjs,package.json,package-lock.json} "$rt/"
          cp "$(command -v node)" "$rt/bin/node"
          cp "$(dirname "$(command -v node)")/../LICENSE" "$rt/Node-LICENSE.txt"
          npm --prefix "$rt" ci --omit=dev
          NOLA_BROWSER_USE_CACHE="$RUNNER_TEMP/uv-cache" bash scripts/bundle_browser_use_runtime.sh "$rt/browser_use"
          cat > "$root/nola" <<'SH'
          #!/bin/sh
          set -eu
          root=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)
          export NOLA_WEB_ROOT="$root/web"
          export NOLA_PLAYWRIGHT_NODE="$root/web/playwright_runtime/bin/node"
          export NOLA_PLAYWRIGHT_BRIDGE="$root/web/playwright_runtime/bridge.cjs"
          exec "$root/bin/nola" "$@"
          SH
          chmod +x "$root/nola"
          tar -C "$RUNNER_TEMP/staging" -czf "$name.tar.gz" "$name"
          installed=$(mktemp -d)
          tar -C "$installed" -xzf "$name.tar.gz"
          "$installed/$name/nola" --version
          "$installed/$name/nola" web --host 127.0.0.1 --port 15001 >"$RUNNER_TEMP/web.log" 2>&1 &
          hostpid=$!
          trap 'kill "$hostpid" 2>/dev/null || true' EXIT
          curl --retry 40 --retry-all-errors --retry-delay 1 --fail http://127.0.0.1:15001/api/health
          curl --fail --location --max-redirs 4 --output "$RUNNER_TEMP/login.html" http://127.0.0.1:15001/
          grep -qi '<!doctype html' "$RUNNER_TEMP/login.html"
          curl --fail --output "$RUNNER_TEMP/ui.html" http://127.0.0.1:15001/ui/index.html
          grep -qi 'type="module"' "$RUNNER_TEMP/ui.html"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: Nola-cli-linux-*.tar.gz
          if-no-files-found: error
