name: Build and verify Nola 1.0.0 build 2
on:
  push:
    branches: [release/build-2-runners]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
        working-directory: apps/windows
      - run: npm run dist:x64
        working-directory: apps/windows
      - name: Install and open the Windows app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = @(Get-ChildItem apps/windows/release/cpu -Filter '*.exe' -File)
          if ($setup.Count -ne 1) { throw 'Expected one NSIS installer' }
          $dir = "$env:RUNNER_TEMP\NolaInstalled"
          $installer = Start-Process $setup[0].FullName -ArgumentList "/S /D=$dir" -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw 'Installer failed' }
          $env:NOLA_E2E_USER_DATA = "$env:RUNNER_TEMP\nola-test-profile"
          $app = Start-Process "$dir\Nola.exe" -PassThru
          try {
            $ready = $false
            foreach ($i in 1..90) {
              Start-Sleep 2
              if ($app.HasExited) { throw 'Installed app exited' }
              $child = Get-CimInstance Win32_Process -Filter "Name='nola.exe'" | Where-Object { $_.ExecutablePath -like "$dir\resources\*" -and $_.CommandLine -match '--port\s+(\d+)' } | Select-Object -First 1
              if ($child -and $child.CommandLine -match '--port\s+(\d+)') {
                try {
                  $response = Invoke-WebRequest "http://127.0.0.1:$($Matches[1])/api/health" -TimeoutSec 2
                  if ($response.StatusCode -eq 200) { $ready = $true; break }
                } catch {}
              }
            }
            if (-not $ready) { throw 'Installed app did not start its Web Host' }
          } finally { if (-not $app.HasExited) { Stop-Process -Id $app.Id } }
          Copy-Item $setup[0].FullName Nola-windows-x86_64-1.0.0-build.2.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: Nola-windows-x86_64-1.0.0-build.2.exe
          if-no-files-found: error
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v6
      - name: Build the CLI and Web Host
        run: |
          set -eu
          npm --prefix apps/web/frontend ci
          npm --prefix apps/web/frontend run build
          cargo build --locked --release -p nola_cli -p nola_service --bins
      - name: Package and test the installed runtime
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -eu
          name="Nola-cli-linux-$ARCH-1.0.0-build.2"
          root="$RUNNER_TEMP/staging/$name"
          rt="$root/web/playwright_runtime"
          mkdir -p "$root/bin" "$root/web/app" "$rt/bin"
          cp target/release/{nola,nola-agent-host,nola-service} "$root/bin/"
          cp LICENSE "$root/"
          cp -R apps/web/app/static "$root/web/app/"
          cp apps/web/playwright_runtime/{bridge.cjs,owner_queue.cjs,browser_use.cjs,package.json,package-lock.json} "$rt/"
          cp "$(command -v node)" "$rt/bin/node"
          cp "$(dirname "$(command -v node)")/../LICENSE" "$rt/Node-LICENSE.txt"
          npm --prefix "$rt" ci --omit=dev
          NOLA_BROWSER_USE_CACHE="$RUNNER_TEMP/uv-cache" bash scripts/bundle_browser_use_runtime.sh "$rt/browser_use"
          cat > "$root/nola" <<'SH'
          #!/bin/sh
          set -eu
          root=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)
          export NOLA_WEB_ROOT="$root/web"
          export NOLA_PLAYWRIGHT_NODE="$root/web/playwright_runtime/bin/node"
          export NOLA_PLAYWRIGHT_BRIDGE="$root/web/playwright_runtime/bridge.cjs"
          exec "$root/bin/nola" "$@"
          SH
          chmod +x "$root/nola"
          tar -C "$RUNNER_TEMP/staging" -czf "$name.tar.gz" "$name"
          installed=$(mktemp -d)
          tar -C "$installed" -xzf "$name.tar.gz"
          "$installed/$name/nola" --version
          "$installed/$name/nola" web --host 127.0.0.1 --port 15001 >"$RUNNER_TEMP/web.log" 2>&1 &
          hostpid=$!
          trap 'kill "$hostpid" 2>/dev/null || true' EXIT
          curl --retry 40 --retry-all-errors --retry-delay 1 --fail http://127.0.0.1:15001/api/health
          curl --fail http://127.0.0.1:15001/ | grep -qi html
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: Nola-cli-linux-*.tar.gz
          if-no-files-found: error
