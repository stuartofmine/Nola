name: Verify existing Tauri installer
on:
  push:
    branches: [release/windows-tauri-acceptance]
permissions:
  contents: read
  actions: read
jobs:
  accept:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 44520360718
          name: windows-tauri-installer
          path: installer
      - run: npm ci
        working-directory: apps/windows
      - name: Inspect installed WebView2 and Host startup
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'NolaInstalled'
          $setup = (Get-ChildItem installer -Filter '*.exe').FullName
          $installer = Start-Process $setup -ArgumentList "/S /D=$dir" -Wait -PassThru
          if ($installer.ExitCode) { throw "Installer exited $($installer.ExitCode)" }
          $env:NOLA_INSTALLED_DESKTOP = Join-Path $dir 'nola-desktop.exe'
          $env:NOLA_HOME = Join-Path $env:RUNNER_TEMP 'nola-test'
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = '--remote-debugging-port=19223'
          $env:WEBVIEW2_USER_DATA_FOLDER = Join-Path $env:NOLA_HOME 'WebProfile'
          $env:NOLA_E2E_USER_DATA = Join-Path $env:NOLA_HOME 'desktop'
          $key = 'HKCU:/Software/Policies/Microsoft/Edge/WebView2/AdditionalBrowserArguments'
          New-Item -Force $key | Out-Null
          New-ItemProperty -Path $key -Name 'nola-desktop.exe' -Value '--remote-debugging-port=19223' -Force | Out-Null
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          $p = Start-Process $env:NOLA_INSTALLED_DESKTOP -PassThru
          Start-Sleep -Seconds 10
          $p.Refresh()
          Write-Host ("Launched desktop, exited " + $p.HasExited + " pid " + $p.Id + " window " + $p.MainWindowHandle)
          if ($p.MainWindowHandle -ne 0) {
            $root = [System.Windows.Automation.AutomationElement]::FromHandle($p.MainWindowHandle)
            $nodes = $root.FindAll([System.Windows.Automation.TreeScope]::Descendants,[System.Windows.Automation.Condition]::TrueCondition)
            $nodes | Select-Object -First 85 | ForEach-Object { Write-Output ($_.Current.ControlType.ProgrammaticName + ' ' + $_.Current.Name) }
          }
          Get-CimInstance Win32_Process -Filter "Name='msedgewebview2.exe'" | ForEach-Object { Write-Output ("WebView2 test port: " + ($_.CommandLine -like '*19223*') + ' Parent ' + $_.ParentProcessId) }
          foreach ($file in @('host-port','host-startup.log')) {
            $path = Join-Path $env:NOLA_E2E_USER_DATA $file
            if (Test-Path $path) { Get-Content $path -Tail 12 }
          }
          $meta = Invoke-RestMethod http://127.0.0.1:19223/json/version
          Write-Output ("CDP " + $meta.Browser + " protocol " + $meta.'Protocol-Version')
          Stop-Process -Id $p.Id -Force
          npm --prefix apps/windows run test:e2e
          exit $LASTEXITCODE
