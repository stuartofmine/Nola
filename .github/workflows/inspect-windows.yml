name: Verify existing Tauri installer
on:
  push:
    branches: [release/windows-tauri-acceptance]
permissions:
  contents: read
  actions: read
jobs:
  accept:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 44520360718
          name: windows-tauri-installer
          path: installer
      - run: npm ci
        working-directory: apps/windows
      - name: Inspect installed WebView2 and Host startup
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'NolaInstalled'
          $setup = (Get-ChildItem installer -Filter '*.exe').FullName
          $installer = Start-Process $setup -ArgumentList "/S /D=$dir" -Wait -PassThru
          if ($installer.ExitCode) { throw "Installer exited $($installer.ExitCode)" }
          $env:NOLA_INSTALLED_DESKTOP = Join-Path $dir 'nola-desktop.exe'
          & apps/windows/scripts/test-installed-ui.ps1
