[package]
default-run = "nola"
name = "nola_cli"
version = "0.1.0"
edition = "2021"

# `nola` and `nola-agent-host` link the shared library composition through
# distinct typed entry points. Public seams used by only one frontend,
# tests, or optional runtime integrations are not dead product code.
[lints.rust]
dead_code = "allow"

[lib]
name = "nola_cli"
path = "src/lib.rs"

[features]
default = ["terminal-ui"]
terminal-ui = ["dep:crossterm", "dep:unicode-width", "dep:unicode-segmentation", "dep:arboard", "dep:image"]
native-host = []

[[bin]]
name = "nola"
path = "src/main.rs"
required-features = ["terminal-ui"]

[[bin]]
name = "nola-agent-host"
path = "src/nola_agent_host.rs"
test = false
bench = false

[dependencies]
nola_update_host = { path = "../../core/nola-update-host" }
nola_mcp_host = { path = "../../core/nola-mcp-host" }
nola_measurement = { path = "../../core/nola-measurement" }
nola_application_bootstrap = { path = "../../core/nola-application-bootstrap" }
nola_protocol = { path = "../../core/nola-protocol" }
nola_host_protocol = { path = "../../core/nola-host-protocol" }
nola_code_mode_host = { path = "../../core/nola-code-mode-host" }
nola_credential_host = { path = "../../core/nola-credential-host" }
nola_core = { path = "../../core" }
nola_domain = { path = "../../core/nola-domain" }
nola_plugin_host = { path = "../../core/nola-plugin-host" }
nola_application = { path = "../../core/nola-application" }
nola_runtime_driver = { path = "../../core/nola-runtime-driver" }
nola_runtime_supervisor = { path = "../../core/nola-runtime-supervisor" }
nola_service_client = { path = "../../core/nola-service-client" }
nola_service = { path = "../../core/nola-service" }
nola-code-memory = { path = "../../core/nola-code-memory" }
base64 = "0.21"
arboard = { version = "3.6", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"], optional = true }
calamine = "0.36"
chrono = "0.4"
# Use the Unix level-triggered TTY source: the default Mio source can strand
# pending input when SIGWINCH and keyboard readiness arrive in the same batch.
crossterm = { version = "0.29", features = ["use-dev-tty"], optional = true }
hex = "0.4"
sha2 = "0.10"
libc = "0.2"
regex = "1.10"
reqwest = { version = "0.11", default-features = false, features = ["blocking", "json", "rustls-tls-webpki-roots"] }
rustfft = "6.4"
quick-xml = { version = "0.37", features = ["serialize"] }
scraper = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
toml_edit = "0.22"
jsonc-parser = { version = "0.34", features = ["cst", "serde_json"] }
jsonwebtoken = "9"
tokio = { version = "1", features = ["rt", "time", "macros"] }
signal-hook = "0.3"
symphonia = { version = "0.5", default-features = false, features = ["aac", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }
mime_guess = "2.0"
lopdf = { version = "0.42", default-features = false, features = ["wasm_js"] }
tiny_http = "0.12"
unicode-width = { version = "0.1", optional = true }
unicode-segmentation = { version = "1.12", optional = true }
uuid = { version = "1.8", features = ["v4"] }
url = "2.5"
tempfile = "3"
nola_store_port = { path = "../../core/nola-store-port" }

[dev-dependencies]
nola_mcp_host = { path = "../../core/nola-mcp-host", features = ["test-support"] }
nola_agent_engine = { path = "../../core/nola-agent-engine" }
crossterm = { version = "0.29", features = ["use-dev-tty"] }
unicode-width = "0.1"
unicode-segmentation = "1.12"
rusqlite = { version = "0.31", features = ["bundled"] }
nola_store = { path = "../../core/nola-store" }
vt100 = "0.15"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Wdk_System_SystemInformation",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem", "Win32_System_Registry",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }
