<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Nola</title>
    <script>(function(){try{var a=localStorage.getItem('nola.appearance');if(a==='light'||a==='dark')document.documentElement.dataset.appearance=a;}catch(e){}})();</script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Nola requires JavaScript to display the interactive workspace.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
