<!doctype html>
<html><head><meta charset="utf-8"><meta name="color-scheme" content="light dark"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nola</title><style>
:root{color-scheme:light dark;font-family:"Segoe UI Variable","Segoe UI","Microsoft YaHei UI","PingFang SC","Noto Sans CJK SC",sans-serif;--canvas:#faf8f4;--ink:#242923;--accent:#345d50;--on-accent:#ffffff;background:var(--canvas);color:var(--ink)}
@media(prefers-color-scheme:dark){:root{--canvas:#1b1c1a;--ink:#f1f1e9;--accent:#a8c9b7;--on-accent:#192b22}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--canvas);color:var(--ink)}
main{display:grid;place-items:center;gap:16px}
.mark{width:48px;height:48px;display:grid;place-items:center;border-radius:12px;background:var(--accent);color:var(--on-accent);font:italic 600 30px/1 Georgia,serif}
</style></head>
<body><main role="status" aria-label="Nola"><div class="mark" aria-hidden="true">n</div></main><script src="startup.js"></script></body></html>
