<!doctype html>
<html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src data:"><meta name="color-scheme" content="light dark"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nola</title><style>
:root{color-scheme:light dark;font-family:"Segoe UI Variable","Segoe UI","Microsoft YaHei UI","PingFang SC","Noto Sans CJK SC",sans-serif;--canvas:#fafafa;--ink:#111113;--accent:#18181b;--on-accent:#ffffff;background:var(--canvas);color:var(--ink)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--canvas:#0b0b0c;--ink:#f5f5f7;--accent:#f5f5f7;--on-accent:#0b0b0c}}
:root[data-theme="dark"]{color-scheme:dark;--canvas:#0b0b0c;--ink:#f5f5f7;--accent:#f5f5f7;--on-accent:#0b0b0c}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:start center;padding-block:clamp(12px,calc(50vh - 235px),220px) 16px;background:var(--canvas);color:var(--ink)}
main{padding:32px;border:1px solid transparent}
@media(max-width:500px){main{padding:24px}}
.mark{width:48px;height:48px;display:grid;place-items:center;border-radius:12px;background:var(--accent);color:var(--on-accent);font:italic 600 30px/1 Georgia,serif}
</style></head>
<body><main role="status" aria-label="Nola"><div class="mark" aria-hidden="true">n</div></main><script src="startup.js"></script></body></html>
