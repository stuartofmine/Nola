name = 'nola'
main = "worker/src/index.ts"
compatibility_date = "2026-05-10"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "nola_backend_fresh"
database_id = "1928aeb8-e401-417e-94b4-4c8a5c071ab9"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1




# Configure nola_backend_env as a Worker JSON variable or Secret in Cloudflare.
# Do not commit production secrets here.
