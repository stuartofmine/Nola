[package]
name = "nola_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "nola_core"
# Native ABI artifacts are produced only by nola_mobile_bindings. Keeping
# staticlib/cdylib here also creates an unhashed deps/libnola_core.rlib, which
# different feature builds can overwrite while another Cargo invocation is
# running tests/rustdoc in the shared target directory.
crate-type = ["rlib"]

[dependencies]
nola_agent_engine = { path = "nola-agent-engine" }
nola_domain = { path = "nola-domain" }
nola_kernel = { path = "nola-kernel" }
nola_host_protocol = { path = "nola-host-protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
md5 = "0.7"
regex = "1.10"
uuid = { version = "1.4", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
aes-gcm = "0.10"
base64 = "0.21"
hmac = "0.12"
