[package]
name = "nola_application"
version = "0.1.0"
edition = "2021"

[dependencies]
nola_measurement = { path = "../nola-measurement" }
nola_store_port = { path = "../nola-store-port" }
nola_domain = { path = "../nola-domain" }
nola_protocol = { path = "../nola-protocol" }
nola_kernel = { path = "../nola-kernel" }
nola_agent_engine = { path = "../nola-agent-engine" }
nola_host_protocol = { path = "../nola-host-protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.21"
url = "2.5"
sha2 = "0.10"
uuid = { version = "1.10", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"

[dev-dependencies]
nola_store = { path = "../nola-store" }
tempfile = "3.12"
rusqlite = { version = "0.31", features = ["bundled"] }
