[package]
name = "nola_code_mode_host"
version = "0.1.0"
edition = "2021"

[dependencies]
nola_domain = { path = "../nola-domain" }
rquickjs = { version = "=0.14.0", default-features = false, features = ["std", "futures"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "time", "sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time", "sync"] }
