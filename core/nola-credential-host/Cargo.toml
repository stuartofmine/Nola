[package]
name = "nola_credential_host"
version = "0.1.0"
edition = "2021"

[dependencies]
libc = "0.2"
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
url = "2.5"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_Threading"] }
