[package]
name = "nola_kernel"
version = "0.1.0"
edition = "2021"

[dependencies]
nola_domain = { path = "../nola-domain" }

serde_json = "1.0"

serde = { version = "1.0", features = ["derive"] }
jsonschema = { version = "=0.33.0", default-features = false }
sha2 = "0.10"
regex = "1"

chrono = { version = "0.4", default-features = false, features = ["std"] }
