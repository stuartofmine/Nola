[package]
name = "nola_mcp_host"
version = "0.1.0"
edition = "2021"

[features]
test-support = []

[dependencies]
nola_core = { path = ".." }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
url = "2.5"
uuid = { version = "1.8", features = ["v4"] }
reqwest = { version = "0.11", default-features = false, features = ["blocking", "json", "rustls-tls-webpki-roots"] }

[dev-dependencies]
tempfile = "3"
