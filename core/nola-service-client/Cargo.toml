[package]
name = "nola_service_client"
version = "0.1.0"
edition = "2021"

[dependencies]
nola_protocol = { path = "../nola-protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
socket2 = "0.5"

[target.'cfg(windows)'.dependencies]
uds_windows = "1.2.1"
nola_credential_host = { path = "../nola-credential-host" }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_System_Threading"] }
