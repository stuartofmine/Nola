<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Nola · 研究过程与来源</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="reply-presentation.css"><script src="reply-presentation.js"></script><style>body{padding:24px}.preview{max-width:720px;margin:auto}.preview[data-platform=mobile]{max-width:390px}.controls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}.controls button,.controls select{min-height:44px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}.note{margin-block:20px;font-size:12px;color:var(--muted)}</style></head><body><div class="controls"><select id="platform" aria-label="平台"><option value="desktop">Mac / Web / Windows</option><option value="mobile">iOS / Android</option></select><button id="theme">切换明暗</button><button data-stage="reading">正在阅读来源</button><button data-stage="waiting">工具完成，模型继续</button><button data-stage="incomplete">未完成</button><button data-stage="completed">已完成</button></div><div class="preview" id="preview"><p>先固定实际任务，再测同一组输入。分别记录首字延迟、生成速度和峰值内存。</p><div id="reply"></div><p class="note">合成设计示例，不调用模型或工具；来源使用保留示例域名。</p></div><script>document.querySelector('#reply').innerHTML=replyPresentation.render('preview');document.querySelectorAll('[data-stage]').forEach(button=>button.onclick=()=>document.querySelector('#reply').innerHTML=replyPresentation.stage('preview',button.dataset.stage));document.querySelector('#platform').onchange=event=>document.querySelector('#preview').dataset.platform=event.target.value;document.querySelector('#theme').onclick=()=>document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';</script></body></html>
